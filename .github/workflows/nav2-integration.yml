name: Nav2 Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nav2-integration:
    name: Nav2 lifecycle recovery (ROS 2 ${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    env:
      ROS_DOMAIN_ID: '93'
    steps:
      - uses: actions/checkout@v4
      - name: Install Nav2 integration dependencies
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip python3-colcon-common-extensions \
            ros-${{ matrix.ros_distro }}-nav2-map-server \
            ros-${{ matrix.ros_distro }}-nav-msgs \
            ros-${{ matrix.ros_distro }}-std-msgs \
            ros-${{ matrix.ros_distro }}-tf2-msgs \
            ros-${{ matrix.ros_distro }}-diagnostic-msgs \
            ros-${{ matrix.ros_distro }}-statistics-msgs \
            ros-${{ matrix.ros_distro }}-lifecycle-msgs \
            ros-${{ matrix.ros_distro }}-rosbag2-storage-default-plugins
          pip3 install --break-system-packages fastapi uvicorn websockets pydantic psutil pyyaml \
            || pip3 install fastapi uvicorn websockets pydantic psutil pyyaml
      - name: Build and verify Nav2 fault and recovery
        shell: bash
        run: |
          set -e
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --packages-select ros_graph_debugger --executor sequential
          source install/setup.bash
          dpkg-query -W ros-${{ matrix.ros_distro }}-nav2-map-server
          python3 test/integration/run_nav2_scenario.py --output nav2-artifacts
      - name: Save Nav2 recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav2-${{ matrix.ros_distro }}
          path: nav2-artifacts/
          if-no-files-found: warn
