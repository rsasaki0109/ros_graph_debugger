name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (ROS 2 ${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install build & runtime dependencies
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip python3-colcon-common-extensions \
            ros-${{ matrix.ros_distro }}-std-msgs \
            ros-${{ matrix.ros_distro }}-tf2-msgs \
            ros-${{ matrix.ros_distro }}-diagnostic-msgs \
            ros-${{ matrix.ros_distro }}-statistics-msgs \
            ros-${{ matrix.ros_distro }}-lifecycle-msgs \
            python3-bt2
          # Web/API stack is pip-only. --break-system-packages is unknown to the
          # older pip on 22.04 (humble) and required on 24.04 (jazzy), so try it
          # then fall back. No -U: it would try to uninstall debian-managed
          # packages (e.g. PyYAML) which have no RECORD file.
          pip_install() { pip3 install --break-system-packages "$@" || pip3 install "$@"; }
          pip_install fastapi uvicorn websockets pydantic psutil pyyaml
          # fastapi pulls a modern anyio whose pytest plugin needs pytest>=7;
          # 22.04 ships 6.2.5. Install a newer one alongside (--ignore-installed
          # avoids touching the debian-managed copy) only when too old.
          python3 -c "import pytest,sys;sys.exit(0 if int(pytest.__version__.split('.')[0])>=7 else 1)" \
            || pip_install --ignore-installed "pytest>=7,<9"

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --packages-select ros_graph_debugger

      - name: pytest
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source install/setup.bash
          python3 -m pytest test/ -v

  integration:
    name: multiprocess integration (ROS 2 ${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    env:
      ROS_DOMAIN_ID: '91'
    steps:
      - uses: actions/checkout@v4
      - name: Install integration dependencies
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip python3-colcon-common-extensions \
            ros-${{ matrix.ros_distro }}-std-msgs \
            ros-${{ matrix.ros_distro }}-tf2-msgs \
            ros-${{ matrix.ros_distro }}-diagnostic-msgs \
            ros-${{ matrix.ros_distro }}-statistics-msgs \
            ros-${{ matrix.ros_distro }}-lifecycle-msgs \
            ros-${{ matrix.ros_distro }}-std-srvs \
            ros-${{ matrix.ros_distro }}-rosbag2-storage-default-plugins
          pip3 install --break-system-packages fastapi uvicorn websockets pydantic psutil pyyaml \
            || pip3 install fastapi uvicorn websockets pydantic psutil pyyaml
      - name: Build and run real ROS scenarios
        shell: bash
        run: |
          set -e
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --packages-select ros_graph_debugger --executor sequential
          source install/setup.bash
          python3 test/integration/run_scenario.py --output integration-artifacts
          python3 test/integration/run_clock_scenario.py --output integration-artifacts/clock
          python3 test/integration/run_cpu_scenario.py --output integration-artifacts/cpu
          python3 test/integration/run_probe_delay_scenario.py --output integration-artifacts/probe-delay
      - name: Save integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.ros_distro }}
          path: integration-artifacts/
          if-no-files-found: warn

  investigation:
    name: frozen investigation evidence (ROS 2 ${{ matrix.ros_distro }})
    needs: [integration, trace-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only replay and MCP dependencies
        run: RGD_PYPI_BUILD=1 python -m pip install -e '.[web]' 'mcp==1.30.0'
      - uses: actions/download-artifact@v4
        with:
          name: integration-${{ matrix.ros_distro }}
          path: investigation-source
      - uses: actions/download-artifact@v4
        with:
          name: trace-${{ matrix.ros_distro }}
          path: investigation-traces
      - name: Prepare cases and verify original evidence
        run: |
          python test/benchmarks/investigation_cases.py prepare --integration investigation-source --trace-recordings investigation-traces --output investigation-bundle
          python test/benchmarks/validate_investigation.py --bundle investigation-bundle --output investigation-validation
      - name: Save tasks, citations, responses and negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investigation-${{ matrix.ros_distro }}
          path: |
            investigation-bundle/
            investigation-validation/
          if-no-files-found: error

  trace-integration:
    name: real LTTng integration (ROS 2 ${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    env:
      ROS_DOMAIN_ID: '92'
    steps:
      - uses: actions/checkout@v4
      # Humble's released tracetools has wrapper symbols but no LTTng backend.
      # Overlay the same official version with UST enabled; never fake events.
      - name: Get Humble tracetools 4.1.2 source
        if: matrix.ros_distro == 'humble'
        uses: actions/checkout@v4
        with:
          repository: ros2/ros2_tracing
          ref: 3c159b382d2d565e26eaa91e39c9ec06a5c6fe88
          path: .trace-source
          sparse-checkout: tracetools
      - name: Install tracing dependencies
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config lttng-tools liblttng-ust-dev python3-bt2 \
            python3-pip python3-colcon-common-extensions \
            ros-${{ matrix.ros_distro }}-std-msgs \
            ros-${{ matrix.ros_distro }}-std-srvs \
            ros-${{ matrix.ros_distro }}-tf2-msgs \
            ros-${{ matrix.ros_distro }}-diagnostic-msgs \
            ros-${{ matrix.ros_distro }}-statistics-msgs \
            ros-${{ matrix.ros_distro }}-lifecycle-msgs
          pip3 install --break-system-packages fastapi uvicorn websockets pydantic psutil pyyaml \
            || pip3 install fastapi uvicorn websockets pydantic psutil pyyaml
      - name: Build and test real callback traces
        shell: bash
        run: |
          set -e
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          if [[ "$ROS_DISTRO" == humble ]]; then
            # Keep the overlay ABI aligned with the distro's released library.
            python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          source = ET.parse('.trace-source/tracetools/package.xml').findtext('version')
          installed = ET.parse('/opt/ros/' + os.environ['ROS_DISTRO'] + '/share/tracetools/package.xml').findtext('version')
          assert source == installed, (source, installed)
          PY
            colcon build --base-paths .trace-source/tracetools \
              --build-base .trace-overlay-build --install-base .trace-overlay \
              --packages-select tracetools --executor sequential \
              --cmake-args -DBUILD_TESTING=OFF
            source .trace-overlay/setup.bash
          fi
          # Fail explicitly if the selected ROS binaries cannot emit real UST events.
          ros2 run tracetools status
          colcon build --packages-select ros_graph_debugger --executor sequential
          source install/setup.bash
          cmake -S test/integration/trace_fixture -B .trace-fixture-build
          cmake --build .trace-fixture-build --parallel 2
          python3 test/integration/run_trace_scenario.py \
            --output trace-artifacts --fixture .trace-fixture-build/trace_fixture
      - name: Save real traces and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.ros_distro }}
          path: trace-artifacts/
          if-no-files-found: warn

  web-check:
    name: web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS syntax check
        run: node --check ros_graph_debugger/web/app.js
      - name: Verify vendored libraries are real JS (not error pages)
        shell: bash
        run: |
          for f in ros_graph_debugger/web/vendor/*.js; do
            head -c 200 "$f" | grep -qiE 'cytoscape|dagre|module|function' \
              && echo "ok: $f" || { echo "suspect: $f"; exit 1; }
          done

  package:
    name: PyPI package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check
        env:
          RGD_PYPI_BUILD: '1'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean venv and smoke-test the CLI
        shell: bash
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[web]"
          cd /tmp
          /tmp/venv/bin/rgd version
          /tmp/venv/bin/rgd assert --demo --fail-on never --require-node /detector
          /tmp/venv/bin/python -c "from ros_graph_debugger.paths import find_web_dir, find_profile; import os; assert os.path.isfile(os.path.join(find_web_dir(), 'index.html')); assert find_profile('autoware')"

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rgd:ci
      - name: Agent entrypoint starts
        run: docker run --rm --entrypoint /ros_entrypoint.sh rgd:ci ros2 run ros_graph_debugger rgd version
