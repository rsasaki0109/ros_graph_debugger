name: Release

# Push a tag `vX.Y.Z` (matching ros_graph_debugger/__init__.py) to publish:
#   - sdist + wheel to PyPI (trusted publishing; see docs/releasing.md)
#   - the agent image to ghcr.io/<owner>/ros_graph_debugger (jazzy + humble)
# Run it manually (workflow_dispatch) for a dry run: everything builds,
# nothing is published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import ros_graph_debugger as m; print(m.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Build
        env:
          RGD_PYPI_BUILD: '1'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: dist
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: image (ROS 2 ${{ matrix.ros_distro }})
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, humble]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          tags="$image:$version-${{ matrix.ros_distro }},$image:${{ matrix.ros_distro }}"
          # jazzy is the default distro: it also gets the bare version + latest.
          if [ "${{ matrix.ros_distro }}" = jazzy ]; then
            tags="$tags,$image:$version,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ROS_DISTRO=${{ matrix.ros_distro }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.tags.outputs.tags }}
